<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Importar Carteira - Monitor B3</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        .card-custom {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-4">

<div class="container" style="max-width: 520px;">
    <div class="card card-custom p-4 shadow-lg">
        <div class="d-flex align-items-center gap-2 mb-2">
            <i class="bi bi-file-earmark-pdf-fill text-danger fs-3"></i>
            <h4 class="fw-bold mb-0 text-white">Importar Carteira (PDF)</h4>
        </div>
        <p class="text-muted small mb-4">
            Selecione o arquivo PDF para extrair e atualizar os ativos da sua carteira.
        </p>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-4">
                {{ form.as_p }}
            </div>

            <div class="d-flex gap-2">
                <a href="{% url 'home' %}" class="btn btn-outline-secondary w-50">
                    <i class="bi bi-arrow-left me-1"></i> Voltar
                </a>
                <button type="submit" class="btn btn-primary w-50">
                    <i class="bi bi-upload me-1"></i> Processar PDF
                </button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
